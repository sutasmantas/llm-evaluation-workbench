name: Deploy browser workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble workspace
        run: |
          mkdir -p _site
          cp proofgrid_web/index.html _site/index.html
          cp proofgrid_web/app.js proofgrid_web/browser-data.js proofgrid_web/styles.css _site/
          cp docs/evidence/frozen-experiment.json _site/frozen-experiment.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
