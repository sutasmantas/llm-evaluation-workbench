[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgrid-provider-contracts"
version = "0.1.0"
description = "Vendor-neutral chat completion and deterministic replay contracts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mantas Sutas" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

